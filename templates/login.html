<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="container" style="max-width: 400px; margin-top: 5rem;">
    <div class="card">
      <h2>Welcome Back</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>
      <p style="margin-top: 1rem;">Don't have an account? <a href="/register">Register</a></p>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('username', document.getElementById('username').value);
      formData.append('password', document.getElementById('password').value);
      
      const res = await fetch('/token', { method: 'POST', body: formData });
      if (res.ok) {
        window.location.href = '/dashboard';
      } else {
        alert('Invalid credentials');
      }
    });
  </script>
</body>
</html>
