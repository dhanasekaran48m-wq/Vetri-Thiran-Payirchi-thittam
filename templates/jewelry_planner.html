<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jewelry Planner - PocketSmart</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <h2>PocketSmart</h2>
    <nav><a href="/dashboard">Dashboard</a></nav>
  </header>
  <div class="container">
    <div class="card">
      <h2>Jewelry Budget Planner</h2>
      <form id="jewelryForm" enctype="multipart/form-data">
        <div class="form-group">
          <label>Total Budget (₹)</label>
          <input type="number" id="total_budget" name="total_budget" required>
        </div>
        <div class="form-group">
          <label>Occasion</label>
          <input type="text" id="occasion" name="occasion" required>
        </div>
        <div class="form-group">
          <label>Outfit Image (Optional)</label>
          <input type="file" id="image" name="image" accept="image/*">
        </div>
        <button type="submit" class="btn">Get Recommendations</button>
      </form>
    </div>
    <div id="results" class="card" style="margin-top:2rem; display:none;"></div>
  </div>
  <script>
    document.getElementById('jewelryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(document.getElementById('jewelryForm'));
      
      const res = await fetch('/jewelry-budget', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      const div = document.getElementById('results');
      div.style.display = 'block';
      
      let html = `<h2>Jewelry Recommendations</h2>`;
      if (data.outfit_analysis) {
        html += `<p><strong>Outfit Analysis:</strong> Style: ${data.outfit_analysis.style}, Colors: ${data.outfit_analysis.colors}</p>`;
      }
      html += `<table><tr><th>Item</th><th>Style</th><th>Price</th><th>Shop</th></tr>`;
      data.jewelry_recommendations?.forEach(i => {
        let links = '';
        if (i.shopping_links) {
          for (let [p, u] of Object.entries(i.shopping_links)) {
            links += `<a href="${u}" target="_blank" class="link-badge">${p}</a> `;
          }
        }
        html += `<tr><td>${i.item_type}<br><small>${i.description}</small></td><td>${i.style}</td><td>₹${i.estimated_price}</td><td>${links}</td></tr>`;
      });
      html += `</table>`;
      div.innerHTML = html;
    });
  </script>
</body>
</html>
